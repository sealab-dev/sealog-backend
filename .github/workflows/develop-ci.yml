name: Develop PR Check

on:
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # ubuntu-latest에 Docker가 기본 설치되어 있어 Testcontainers가 바로 동작한다.
    # MariaDB / Redis 컨테이너는 Testcontainers(AbstractContainerTest)가 직접 기동하므로
    # GitHub Actions services 블록이 필요없다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Unit Test
        run: ./gradlew unitTest --no-daemon
