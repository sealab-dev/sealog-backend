spring:
    profiles:
        active: local

    application:
        name: sealog-backend

    data:
        rest:
            base-path: /api

    datasource:
        url: jdbc:mariadb://localhost:3306/devdb
        username: devuser
        password: devpass
        driver-class-name: org.mariadb.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            connection-init-sql: SET time_zone = '+09:00'

    jpa:
        show-sql: false
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 20
        open-in-view: false

    task:
        scheduling:
            enabled: false

    servlet:
        multipart:
            enabled: true
            max-file-size: 100MB
            max-request-size: 100MB

    cloud:
        aws:
            credentials:
                access-key: your_access_key
                secret-key: your_secret_key
            region:
                static: ap-northeast-2
            s3:
                bucket: your-bucket-name
            cloudfront:
                domain: your-cloudfront-domain.cloudfront.net
                distribution-id: your_distribution_id

    ai:
        openai:
            api-key: EXAMPLE123
            chat:
                options:
                    model: gpt-4o-mini

            embedding:
                options:
                    model: text-embedding-3-small


server:
    port: 8080

app:
    origin:
        frontend: http://localhost:5173
    cookie:
        secure: false
        sameSite: Lax

jwt:
    secret: bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LTEyMzQ1Njc4OTAtYWJjZGVm
    access-token-validity: 3600000
    refresh-token-validity: 86400000

file:
    local:
        upload-dir: ./uploads
        base-url: http://localhost:8080/files

logging:
    file:
        name:
    logback:
        rollingpolicy:
            max-file-size: 10MB
            max-history: 30  # 파일 생성 후 30일까지 존재
    level:
        com.blog.backend: DEBUG
        com.blog.backend.feature.file: DEBUG
        com.blog.backend.infra.storage: DEBUG
        software.amazon.awssdk: INFO
        org.hibernate.SQL: ERROR


springdoc:
    swagger-ui:
        path: /docs