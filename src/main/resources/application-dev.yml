spring:
    datasource:
        url: jdbc:mariadb://localhost:3306/devdb
        username: devuser
        password: devpass
        driver-class-name: org.mariadb.jdbc.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
    task:
        scheduling:
            enabled: false

    # 로컬 Redis 설정
    data:
        redis:
            host: localhost
            port: 6379

    # 로컬 클라우드 환경 (더미 또는 LocalStack 설정)
    cloud:
        aws:
            credentials:
                access-key: ${AWS_ACCESS_KEY:test-access-key}
                secret-key: ${AWS_SECRET_KEY:test-secret-key}
            region:
                static: ap-northeast-2
            s3:
                bucket: ${AWS_BUCKET:test-bucket}
            cloudfront:
                domain: ${AWS_DOMAIN:localhost}
                distribution-id: ${AWS_DISTRIBUTION_ID:ID1234}

app:
    origin:
        frontend: http://localhost:5173
    cookie:
        secure: false
        sameSite: Lax

jwt:
    secret: bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LTEyMzQ1Njc4OTAtYWJjZGVm
    access-token-validity: 3600000
    refresh-token-validity: 604800000

file:
    local:
        upload-dir: ./uploads
        base-url: http://localhost:8080/files

logging:
    level:
        com.sealog.backend: DEBUG
        software.amazon.awssdk: INFO
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
