spring:
  application:
    name: sealog-backend

  data:
    rest:
      base-path: /api

  # H2 인메모리 DB
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MariaDB
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 스케줄러 비활성화 (테스트 시 불필요)
  task:
    scheduling:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # AWS 설정 (dummy 값, 실제로는 Mock 처리)
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: test-bucket
      cloudfront:
        domain: test.cloudfront.net
        distribution-id: TEST123

server:
  port: 8080

logging:
  level:
    com.blog.backend: DEBUG
    org.hibernate.SQL: DEBUG

app:
  origin:
    frontend: http://localhost:5173
  cookie:
    secure: false
    sameSite: Lax

# JWT (테스트용 고정값)
jwt:
  secret: test-jwt-secret-key-1234567890-abcdefghijklmnop
  access-token-validity: 3600000
  refresh-token-validity: 86400000