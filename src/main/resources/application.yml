spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}

    application:
        name: sealog-backend

    # REST Base Path
    data:
        rest:
            base-path: /api

    # MariaDB 10.11
    datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USER}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.mariadb.jdbc.Driver
        # HikariCP Connection Pool
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            connection-init-sql: SET time_zone = '+09:00'

    # JPA Basic Settings
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: ${JPA_HIBERNATE_DDL:none}
        properties:
            hibernate:
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 20
        open-in-view: false

    # 스케줄러 활성화 (고아 파일 정리용)
    task:
        scheduling:
            enabled: true

    # 파일 업로드 설정
    servlet:
        multipart:
            enabled: true
            max-file-size: 100MB
            max-request-size: 100MB

# Server Port
server:
    port: ${SERVER_PORT:8080}

# SQL Logging
logging:
    level:
        com.blog.backend.feature.file: DEBUG
        com.blog.backend.infra.storage: DEBUG
        software.amazon.awssdk: INFO
        org:
            hibernate:
                SQL: ERROR
                type:
                    descriptor:
                        sql:
                            BasicBinder: ERROR

# Front Server URL
app:
    origin:
        frontend: ${FRONT_ORIGIN}
    cookie:
        secure: ${COOKIE_IS_SECURE}
        sameSite: ${COOKIE_SAMESITE:Lax}

# JWT
jwt:
    secret: ${JWT_KEY}
    access-token-validity: ${JWT_ACCESS_TTL}
    refresh-token-validity: ${JWT_REFRESH_TTL}